<!DOCTYPE html>
<html lang="{{ site.Language.Lang | default `en` }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body
    class="{{ if .IsHome }}is-home{{ else }}is-page{{ end }}"
    data-raindrop-disabled="{{ if site.Params.background.raindropEnabled }}false{{ else }}true{{ end }}"
  >
    <div class="site-shell">
      <div
        id="rain-backdrop"
        class="rain-backdrop"
        data-bg="{{ site.Params.background.image | default `/images/rain-background.png` }}"
        aria-hidden="true"
      ></div>
      <canvas
        id="raindrop-canvas"
        class="rain-canvas"
        data-bg="{{ site.Params.background.image | default `/images/rain-background.png` }}"
        aria-hidden="true"
      ></canvas>
      <div class="site-noise" aria-hidden="true"></div>
      <header class="topbar-wrap">
        {{ partial "header.html" . }}
      </header>
      <main class="page-wrap">
        {{ block "main" . }}{{ end }}
      </main>
    </div>
    <script src="{{ `vendor/raindrop-fx.js` | relURL }}" defer></script>
    <script src="{{ `js/theme.js` | relURL }}" defer></script>
  </body>
</html>
