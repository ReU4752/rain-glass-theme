{{ define "main" }}
  <section class="listing-panel glass-panel">
    <header class="section-header section-header-spaced">
      <div>
        <p class="eyebrow">{{ .Data.Plural }}</p>
        <h1>{{ .Title }}</h1>
      </div>
    </header>
    <div class="tag-cloud">
      {{ range .Pages }}
        <a class="tag-pill" href="{{ .RelPermalink }}">{{ .Title }}</a>
      {{ else }}
        <div class="empty-state glass-subpanel">{{ i18n "no_terms" }}</div>
      {{ end }}
    </div>
  </section>
{{ end }}
