{{ $profile := site.Params.profile }}
<div class="home-sidebar-track">
  <aside class="home-sidebar glass-panel">
    <div class="profile-head">
      <img class="profile-avatar" src="{{ $profile.avatar | default `/images/avatar-default.svg` | relURL }}" alt="{{ $profile.name }}">
      <div>
        <h2>{{ $profile.name | default site.Title }}</h2>
        {{ with $profile.bio }}
          <p>{{ . }}</p>
        {{ end }}
      </div>
    </div>

    {{ with site.Taxonomies.categories.Alphabetical }}
      <section class="sidebar-section">
        <h3>{{ i18n "categories" }}</h3>
        {{ partial "category-tree.html" (dict "emptyText" (i18n "no_terms")) }}
      </section>
    {{ end }}
  </aside>
</div>
